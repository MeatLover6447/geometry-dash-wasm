name: Publish browser build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Verify complete native package
        run: |
          node tests/verify-build.mjs
          node tests/benchmark.test.mjs
          node tests/worker.test.mjs
          node tests/audio-paths.test.mjs
          node tests/quality.test.mjs
          node tests/reduced-effects.test.mjs
          node tests/reduced-area-colors.test.mjs
          node tests/affine-transform.test.mjs
      - name: Prepare static Pages build
        run: node scripts/build-pages.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages
      - uses: actions/deploy-pages@v4
        id: deployment
